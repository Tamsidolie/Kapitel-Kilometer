
name: Update Podcast Website

on:
  push:
    branches:
      - main

  schedule:
    - cron: "0 4 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Abhängigkeiten installieren
        run: npm install

      - name: RSS-Feed abrufen
        run: npm run fetch-rss

      - name: Änderungen speichern
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull
          git add data/episodes.json
          git diff --cached --quiet || git commit -m "Update podcast episodes"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Website hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Website veröffentlichen
        uses: actions/deploy-pages@v4